<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>
<body class="p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="m-0">Your tasks!</h1>
        <a href="/logout" class="btn btn-outline-danger">Logout</a>
    </div>

    <div class="table-responsive">
        <table class="table table-sm table-striped table-hover table-bordered align-middle" style="--bs-border-color: #444;">
            <thead>
                <tr>
                    <th scope="col" style="width: 10%">#</th>
                {% for date in dates %}
                    <th scope="col" style="width: 50%">{{ date }}</th>
                {% endfor %}
                    <th scope="col" style="width: 50%">Marked By</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">{{ current_user.id }}</th>
                    {% for date in dates %}
                    <td>{{ attendance_map.get(current_user.id, {}).get(date, '-') }}</td>
                    {% endfor %}
                    <td>{{ teacher_map.get(date, '-') }}</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
